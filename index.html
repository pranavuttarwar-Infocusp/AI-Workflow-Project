<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskPulse — Simple Task Tracker</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181b24;
    --surface-2: #1f232f;
    --border: #2a2f3d;
    --text: #e8eaf0;
    --text-dim: #9aa0b0;
    --accent: #6c8cff;
    --accent-soft: rgba(108, 140, 255, 0.15);
    --green: #4cd48a;
    --amber: #f0b95a;
    --red: #f07a7a;
    --radius: 14px;
  }
  body.light {
    --bg: #f4f5f9;
    --surface: #ffffff;
    --surface-2: #eceef4;
    --border: #d9dce6;
    --text: #1c1f27;
    --text-dim: #6b7180;
    --accent: #4c6ef5;
    --accent-soft: rgba(76, 110, 245, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .theme-toggle {
    margin-left: auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 99px; width: 40px; height: 40px; font-size: 18px;
    cursor: pointer; transition: transform 0.15s;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #6c8cff, #a06cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  header p { font-size: 13px; color: var(--text-dim); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 14px;
  }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }
  .stat.total .num { color: var(--accent); }
  .stat.done .num { color: var(--green); }
  .stat.pending .num { color: var(--amber); }
  .stat.rate .num { color: var(--text); }

  .progress-wrap { margin-bottom: 24px; }
  .progress-bar {
    height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #a06cff);
    border-radius: 99px; transition: width 0.4s ease;
  }
  .progress-label { font-size: 12px; color: var(--text-dim); margin-top: 6px; text-align: right; }

  .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .input-row input[type="text"] {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; color: var(--text);
    font-size: 15px; outline: none; transition: border-color 0.2s;
  }
  .input-row input[type="text"]:focus { border-color: var(--accent); }
  .input-row select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 12px; color: var(--text);
    font-size: 14px; outline: none; cursor: pointer;
  }
  .input-row button {
    background: var(--accent); border: none; border-radius: var(--radius);
    padding: 0 22px; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: filter 0.15s;
  }
  .input-row button:hover { filter: brightness(1.12); }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; }
  .filters button {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 99px; padding: 7px 16px; color: var(--text-dim);
    font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  .filters button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .filters .clear-done { margin-left: auto; color: var(--red); border-color: transparent; }
  .filters .clear-done:hover { border-color: var(--red); }
  .filters .clear-done:disabled { opacity: 0.4; cursor: default; border-color: transparent; }

  ul#taskList { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .task {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .task .check {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border);
    background: transparent; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; transition: all 0.15s;
  }
  .task.done .check { background: var(--green); border-color: var(--green); }
  .task .title { flex: 1; font-size: 15px; }
  .task.done .title { text-decoration: line-through; color: var(--text-dim); }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .badge.high { background: rgba(240,122,122,0.15); color: var(--red); }
  .badge.medium { background: rgba(240,185,90,0.15); color: var(--amber); }
  .badge.low { background: rgba(76,212,138,0.15); color: var(--green); }
  .task .del {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 16px; padding: 4px; border-radius: 6px; transition: color 0.15s;
  }
  .task .del:hover { color: var(--red); }

  .empty { text-align: center; padding: 40px 0; color: var(--text-dim); font-size: 14px; }
  .empty .icon { font-size: 36px; margin-bottom: 10px; }

  footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--text-dim); }

  @media (max-width: 520px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">⚡</div>
    <div>
      <h1>TaskPulse</h1>
      <p>A tiny task tracker with live stats — demo project</p>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">☀️</button>
  </header>

  <div class="stats">
    <div class="stat total"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
    <div class="stat done"><div class="num" id="statDone">0</div><div class="label">Done</div></div>
    <div class="stat pending"><div class="num" id="statPending">0</div><div class="label">Pending</div></div>
    <div class="stat rate"><div class="num" id="statRate">0%</div><div class="label">Completion</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">No tasks yet</div>
  </div>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="What needs doing?" />
    <select id="prioritySelect">
      <option value="high">High</option>
      <option value="medium" selected>Medium</option>
      <option value="low">Low</option>
    </select>
    <button id="addBtn">Add</button>
  </div>

  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="pending">Pending</button>
    <button data-filter="done">Done</button>
    <button class="clear-done" id="clearDoneBtn">Clear completed</button>
  </div>

  <ul id="taskList"></ul>

  <footer>TaskPulse demo · data persists in your browser (localStorage)</footer>
</div>

<script>
  const STORAGE_KEY = "taskpulse.tasks";
  let tasks = [];
  let filter = "all";

  const seedTasks = [
    { id: 1, title: "Review the release checklist", priority: "high", done: false },
    { id: 2, title: "Write test cases for the new login flow", priority: "medium", done: true },
    { id: 3, title: "Update the team wiki", priority: "low", done: false },
  ];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : seedTasks;
    } catch { tasks = seedTasks; }
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  function render() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";
    const visible = tasks.filter(t =>
      filter === "all" ? true : filter === "done" ? t.done : !t.done
    );
    if (visible.length === 0) {
      list.innerHTML = '<div class="empty"><div class="icon">🎉</div>Nothing here — add a task above.</div>';
    }
    for (const task of visible) {
      const li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");
      li.innerHTML = `
        <button class="check" aria-label="toggle">${task.done ? "✓" : ""}</button>
        <span class="title"></span>
        <span class="badge ${task.priority}">${task.priority}</span>
        <button class="del" aria-label="delete">✕</button>`;
      li.querySelector(".title").textContent = task.title;
      li.querySelector(".check").onclick = () => { task.done = !task.done; save(); render(); };
      li.querySelector(".del").onclick = () => { tasks = tasks.filter(t => t.id !== task.id); save(); render(); };
      list.appendChild(li);
    }
    renderStats();
  }

  function renderStats() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const pending = total - done;
    const rate = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statPending").textContent = pending;
    document.getElementById("statRate").textContent = rate + "%";
    document.getElementById("progressFill").style.width = rate + "%";
    document.getElementById("progressLabel").textContent =
      total === 0 ? "No tasks yet" : `${done} of ${total} tasks complete`;
    document.getElementById("clearDoneBtn").disabled = done === 0;
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    const title = input.value.trim();
    if (!title) return;
    const priority = document.getElementById("prioritySelect").value;
    tasks.unshift({ id: Date.now(), title, priority, done: false });
    input.value = "";
    save();
    render();
  }

  document.getElementById("addBtn").onclick = addTask;
  document.getElementById("clearDoneBtn").onclick = () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  };
  document.getElementById("taskInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addTask();
  });
  document.querySelectorAll(".filters button").forEach(btn => {
    btn.onclick = () => {
      filter = btn.dataset.filter;
      document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    };
  });

  const THEME_KEY = "taskpulse.theme";
  const themeToggle = document.getElementById("themeToggle");
  function applyTheme(theme) {
    document.body.classList.toggle("light", theme === "light");
    themeToggle.textContent = theme === "light" ? "🌙" : "☀️";
  }
  themeToggle.onclick = () => {
    const next = document.body.classList.contains("light") ? "dark" : "light";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  };
  applyTheme(localStorage.getItem(THEME_KEY) || "dark");

  load();
  render();
</script>
</body>
</html>
